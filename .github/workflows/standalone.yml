name: Standalone installers
on:
  workflow_dispatch:
    inputs:
      draft_release:
        description: 'Draft release with APK assets; publish it after all builds pass'
        required: false
        type: string
permissions:
  contents: read
jobs:
  build:
    # Draft release assets are visible only with repository push access.
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows-x64
            architecture: x64
          - os: macos-15-intel
            target: macos-x64
            architecture: x64
          - os: macos-15
            target: macos-arm64
            architecture: arm64
          - os: ubuntu-22.04
            target: linux-x64
            architecture: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: ${{ matrix.architecture }}
      - run: python -m pip install pyinstaller==6.22.3 certifi==2026.10.23
      - run: python -m unittest discover -s tests -v
      - if: inputs.draft_release != ''
        run: gh release download "$DRAFT_RELEASE" --pattern '*.apk' --dir apks
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DRAFT_RELEASE: ${{ inputs.draft_release }}
      - run: python scripts/build_standalone.py --target ${{ matrix.target }}
        env:
          PYTHONUTF8: '1'
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.target }}
          path: |
            dist/*.zip
            dist/*.sha256
          compression-level: 0
          if-no-files-found: error
  publish:
    if: inputs.draft_release != ''
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          path: release-assets
          merge-multiple: true
      - run: python scripts/verify_release.py release-assets
        env:
          RELEASE_COMMIT: ${{ github.sha }}
          RELEASE_TAG: ${{ inputs.draft_release }}
      - run: |
          gh release upload "$DRAFT_RELEASE" release-assets/*
          gh release edit "$DRAFT_RELEASE" --draft=false --latest
        env:
          GH_TOKEN: ${{ github.token }}
          DRAFT_RELEASE: ${{ inputs.draft_release }}
